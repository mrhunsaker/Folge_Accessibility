[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "folge-vision-pipeline"
dynamic = ["version"]
description = "Semi-Automated documentation publishing pipeline with Ollama Vision AI enrichment and PDF/UA-compliant output"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Michael Ryan Hunsaker, M.Ed., Ph.D." },
]
keywords = [
    "accessibility",
    "alt-text",
    "aria",
    "batch-processing",
    "container",
    "docx",
    "docker",
    "document-publishing",
    "documentation",
    "epub",
    "gui",
    "html",
    "jinja2",
    "json",
    "latex",
    "llm",
    "local-llm",
    "markdown",
    "mkdocs",
    "nicegui",
    "ocr",
    "ollama",
    "pandoc",
    "pdf",
    "pdf-ua",
    "podman",
    "pymupdf",
    "pyinstaller",
    "schema-validation",
    "screen-reader",
    "typst",
    "vision-ai",
    "wcag",
    "weasyprint",
    "web-ui",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Documentation",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Text Processing :: Fonts",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Utilities",
]
dependencies = [
    "jsonschema>=4.17.0",
    "jinja2>=3.1.0",
    "requests>=2.28.0",
    "weasyprint>=60.0",
    "pymupdf>=1.23.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "pypandoc>=1.17",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/mrhunsaker/Folge_Accessibility"
Repository = "https://github.com/mrhunsaker/Folge_Accessibility"
Issues = "https://github.com/mrhunsaker/Folge_Accessibility/issues"

[project.scripts]
folge-cli = "folge_cli.cli:main"

[tool.uv.workspace]
members = ["src/folge_gui"]

[tool.setuptools.dynamic]
version = {attr = "folge_cli._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
folge_cli = ["_version.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
