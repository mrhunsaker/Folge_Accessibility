# Docker Compose file for folge-cli.
#
# Quick start:
#   1. mkdir -p images output && cp /path/to/your/guide.json .
#   2. docker compose run --rm folge-cli pipeline guide.json output
#
# folge-cli looks for guide.json and images/ relative to its own install
# root (see the note at the top of Dockerfile), so this file mounts your
# working files *into /app* alongside the baked-in application code,
# rather than into a separate /data directory.
services:
  folge-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: folge-cli:latest
    container_name: folge-cli

    volumes:
      # Your Folge export and screenshots (README convention: guide.json
      # in the project root, screenshots under images/).
      - ./guide.json:/app/guide.json:ro
      - ./images:/app/images:ro
      # Where rendered output (PDF/DOCX/HTML/...) gets written.
      - ./output:/app/output
      # Optional overrides -- uncomment to use your own instead of the
      # environment variables below / the defaults baked into the image.
      # - ./config.yaml:/app/config.yaml:ro
      # - ./.env:/app/.env:ro

    environment:
      PROVIDER: ${PROVIDER:-ollama}
      # Docker Desktop (Mac/Windows) resolves host.docker.internal out of
      # the box; the extra_hosts entry below makes it work on Linux too.
      # Point this at a different host/port if your Ollama runs elsewhere,
      # or at http://ollama:11434/v1 if you enable the bundled service
      # further down (docker compose --profile with-ollama up).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl-8k:latest}
      # Cloud providers -- only set the one you actually use.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # `docker compose run --rm folge-cli <subcommand> ...` is the normal
    # way to use this -- e.g.:
    #   docker compose run --rm folge-cli pipeline guide.json output
    #   docker compose run --rm folge-cli validate-pdf output/guide.pdf
    # `docker compose up` alone just prints --help (see CMD in Dockerfile).
    command: ["--help"]

  # Optional: run Ollama itself as part of the stack instead of pointing
  # at one already running on the host. Enable with:
  #   docker compose --profile with-ollama up -d ollama
  # ...and then set OLLAMA_BASE_URL=http://ollama:11434/v1 above (compose
  # service names resolve on the shared network).
  ollama:
    image: docker.io/ollama/ollama:latest
    profiles: ["with-ollama"]
    container_name: folge-ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment to use an NVIDIA GPU (requires the NVIDIA Container Toolkit
    # on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-data:
